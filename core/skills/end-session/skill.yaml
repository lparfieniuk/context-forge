id: end-session
name: "End Session"
description: >
  Runs the end-of-session close-out for a work repo: capture diary +
  session-learnings, commit all changes, then auto-merge the working branch
  into main. Generic close-out for other repos; excludes evolve/plugin-audit.
  <example>
  Context: Feature work finished, user signals the session is over.
  user: "kończymy sesję"
  assistant: "[END-SESSION] diary + learnings captured, committed 6 files, merged feature/x → main."
  </example>
category: workflow
tier: 1
model: none
routing_key: "tier1:end-session"
trigger: "User signals session is finishing (kończymy sesję / we're done / wrap up)"
tags: [workflow, session, commit, merge, close-out]
